name: Auto Tag

# Para que as tags criadas aqui disparem o workflow release.yml,
# é necessário um PAT com escopo "workflow" salvo como GH_PAT.
# Com GITHUB_TOKEN o push de tag não aciona outros workflows (limitação do GitHub).
# Se GH_PAT não estiver configurado, crie a release manualmente via:
#   gh workflow run release.yml -f version=vX.Y.Z

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Usa GH_PAT quando disponível para que a tag dispare release.yml.
          # Caso contrário cai no GITHUB_TOKEN (tag criada mas release não dispara).
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get last tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "last_tag=v0.0.0" >> $GITHUB_OUTPUT
            echo "is_first=true" >> $GITHUB_OUTPUT
            echo "Primeira tag será criada"
          else
            echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT
            echo "is_first=false" >> $GITHUB_OUTPUT
            echo "Última tag: ${LAST_TAG}"
          fi

      - name: Check if tag already exists for this commit
        id: check_tag
        run: |
          EXISTING_TAG=$(git tag --points-at HEAD | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+" | head -n 1 || echo "")
          if [ -n "$EXISTING_TAG" ]; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "existing_tag=${EXISTING_TAG}" >> $GITHUB_OUTPUT
            echo "Tag ${EXISTING_TAG} já existe para este commit"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Nenhuma tag encontrada para este commit"
          fi

      - name: Determine version bump type
        id: bump_type
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.last_tag }}"

          if [ "${{ steps.last_tag.outputs.is_first }}" == "true" ]; then
            echo "bump_type=minor" >> $GITHUB_OUTPUT
            echo "Primeira release: v0.1.0"
            exit 0
          fi

          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" --no-merges)

          HAS_BREAKING=false
          HAS_FEAT=false
          HAS_FIX=false
          ONLY_NON_RELEASE=true

          while IFS= read -r commit; do
            # Breaking change: feat!: ou fix!: (conventional commits com !)
            # ou footer "BREAKING CHANGE:" — evita falsos positivos de ! no corpo
            if echo "$commit" | grep -qE "^[a-z]+(\([^)]+\))?!:"; then
              HAS_BREAKING=true
              ONLY_NON_RELEASE=false
            fi
            if echo "$commit" | grep -qE "^BREAKING CHANGE:"; then
              HAS_BREAKING=true
              ONLY_NON_RELEASE=false
            fi
            if echo "$commit" | grep -qE "^feat(\([^)]+\))?:"; then
              HAS_FEAT=true
              ONLY_NON_RELEASE=false
            fi
            if echo "$commit" | grep -qE "^fix(\([^)]+\))?:"; then
              HAS_FIX=true
              ONLY_NON_RELEASE=false
            fi
            # chore/docs/style/refactor/test/ci não geram release sozinhos
            if echo "$commit" | grep -qE "^(chore|docs|style|refactor|test|ci|build)(\([^)]+\))?:"; then
              : # não altera ONLY_NON_RELEASE=true
            else
              # commit que não é nenhum tipo conventional também conta como releasável
              if ! echo "$commit" | grep -qE "^[a-z]+(\([^)]+\))?!?:"; then
                ONLY_NON_RELEASE=false
              fi
            fi
          done <<< "$COMMITS"

          if [ "$ONLY_NON_RELEASE" == "true" ] && [ "$HAS_BREAKING" == "false" ] && [ "$HAS_FEAT" == "false" ] && [ "$HAS_FIX" == "false" ]; then
            echo "bump_type=skip" >> $GITHUB_OUTPUT
            echo "Apenas commits chore/docs/style — sem nova release"
            exit 0
          fi

          if [ "$HAS_BREAKING" == "true" ]; then
            echo "bump_type=major" >> $GITHUB_OUTPUT
            echo "Breaking change detectado: MAJOR bump"
          elif [ "$HAS_FEAT" == "true" ]; then
            echo "bump_type=minor" >> $GITHUB_OUTPUT
            echo "Feature detectada: MINOR bump"
          elif [ "$HAS_FIX" == "true" ]; then
            echo "bump_type=patch" >> $GITHUB_OUTPUT
            echo "Fix detectado: PATCH bump"
          else
            echo "bump_type=patch" >> $GITHUB_OUTPUT
            echo "Commit sem tipo conventional: PATCH bump padrão"
          fi

      - name: Calculate new version
        id: new_version
        if: |
          steps.check_tag.outputs.tag_exists == 'false' &&
          steps.bump_type.outputs.bump_type != 'skip'
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.last_tag }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.bump_type }}"

          if [ "${{ steps.last_tag.outputs.is_first }}" == "true" ]; then
            NEW_VERSION="v0.1.0"
          else
            VERSION=${LAST_TAG#v}
            # Remove sufixo de pre-release caso exista (ex: v1.2.3-rc.1 → 1.2.3)
            VERSION=${VERSION%%-*}
            IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
            MAJOR=${VERSION_PARTS[0]}
            MINOR=${VERSION_PARTS[1]}
            PATCH=${VERSION_PARTS[2]}

            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor)
                MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch)
                PATCH=$((PATCH + 1)) ;;
            esac

            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Nova versão: ${NEW_VERSION}"

      - name: Create and push tag
        if: |
          steps.check_tag.outputs.tag_exists == 'false' &&
          steps.bump_type.outputs.bump_type != 'skip' &&
          steps.new_version.outputs.new_version != ''
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          echo "Criando tag ${NEW_VERSION}…"
          git tag -a "${NEW_VERSION}" -m "Release ${NEW_VERSION}"
          git push origin "${NEW_VERSION}"
          echo "Tag ${NEW_VERSION} criada e enviada com sucesso!"

      - name: Skip (only non-release commits)
        if: steps.bump_type.outputs.bump_type == 'skip'
        run: echo "Apenas commits chore/docs/style detectados — nenhuma tag criada."

      - name: Skip (tag already exists)
        if: steps.check_tag.outputs.tag_exists == 'true'
        run: echo "Tag ${{ steps.check_tag.outputs.existing_tag }} já existe — pulando."
